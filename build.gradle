plugins {
    id 'net.fabricmc.fabric-loom-remap' version "1.17.19"
    id 'maven-publish'
}

group = "com.tomc.leveling"
version = "0.1.0"

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    // 官方 Mojang 映射（mojmap）：Fabric 1.x 时代全用 mojmap，不用 yarn。
    // 注意：mojmap 工程里类名是 BuiltInRegistries/Item.Properties/CommandSourceStack 等，
    // 与社区教程常见的 Yarn 名（Registries/Item.Settings/ServerCommandSource）不同，勿混用。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
    // Mod Menu 集成：compileOnly，仅编译期引用其 API，不作为运行时前置。
    modCompileOnly "maven.modrinth:modmenu:17.0.1"
}

processResources {
    // 把 Gradle version 展开进 fabric.mod.json 的 ${version}。
    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

// 目标 Java 版本用 toolchain 声明：环境 JDK 低于目标（例如环境是 17、目标是 21）时，
// 只有 toolchain 会让 foojay 自动 provision 对应 JDK，否则 javac 报「不支持发行版本」。
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
